name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repo. It never receives AWS credentials,
# so a pull request from a fork cannot reach any account.
permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init without a backend or credentials
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: backend/infra
          config_file: backend/infra/.checkov.yaml
          quiet: true
