<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>SIEM Lite</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip" href="#view">Skip to content</a>

    <section id="login" class="login" hidden>
        <div class="login-card">
            <span class="brand-mark" id="login-mark"></span>
            <h1>SIEM Lite</h1>
            <p>Sign in to see your security incidents.</p>
            <p id="login-banner" class="banner" role="status" hidden></p>
            <button id="login-btn" class="btn btn-primary" type="button">Sign in</button>
        </div>
    </section>

    <div id="shell" class="shell" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark" id="brand-mark"></span>
                <span class="brand-name">SIEM Lite</span>
                <button id="collapse" class="icon-btn ghost side-toggle" type="button" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar"></button>
            </div>
            <nav id="nav" class="nav" aria-label="Main"></nav>
        </aside>

        <div class="main-col">
            <header class="topbar">
                <div class="crumb">SIEM Lite / <strong id="crumb"></strong></div>
                <div class="seg" id="range" role="group" aria-label="Time range">
                    <button type="button" data-days="7" aria-pressed="false">7 days</button>
                    <button type="button" data-days="30" aria-pressed="true">30 days</button>
                    <button type="button" data-days="90" aria-pressed="false">90 days</button>
                </div>
                <div class="topbar-right">
                    <span class="pill demo" id="demo" title="Generated data. A new incident arrives about every 20 seconds so the live refresh can be seen." hidden>Demo data</span>
                    <span class="live" id="live"><i class="live-dot"></i><span class="updated" id="updated"></span></span>
                    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh data" title="Refresh"></button>
                    <button id="theme" class="icon-btn" type="button" aria-label="Toggle light and dark theme" title="Theme"></button>
                    <div class="user"><span class="avatar" id="avatar"></span><span id="username"></span><span class="role" id="role" hidden></span></div>
                    <button id="logout" class="btn" type="button">Sign out</button>
                </div>
            </header>
            <div id="banner" class="banner" role="status" hidden></div>
            <main id="view" class="view" tabindex="-1"></main>
        </div>
    </div>

    <div id="scrim" class="scrim" hidden></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
    <div id="tip" class="tip" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <!-- No inline scripts or styles: the page works under a strict Content-Security-Policy -->
    <script src="config.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
