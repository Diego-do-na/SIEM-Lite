<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIEM Lite</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <h1>SIEM Lite</h1>
        <div class="topbar-right">
            <span id="live" class="live" hidden>Live</span>
            <button id="logout" class="btn" hidden>Sign out</button>
        </div>
    </header>

    <main>
        <div id="banner" class="banner" hidden></div>

        <section id="login" class="login" hidden>
            <p>Sign in to see the incidents.</p>
            <button id="login-btn" class="btn btn-primary">Sign in</button>
        </section>

        <div id="app" hidden>
            <section class="tiles" id="tiles"></section>

            <section class="card">
                <div class="card-head">
                    <h2>Incidents by severity</h2>
                    <div class="legend" id="legend"></div>
                </div>
                <div id="windows" class="windows"></div>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Latest incidents</h2>
                    <a href="#history" class="link">Full history</a>
                </div>
                <div class="table-wrap">
                    <table id="incidents">
                        <thead>
                            <tr><th>Time</th><th>Severity</th><th>Score</th><th>Source IP</th><th>User</th><th>Techniques</th><th>Response</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <div class="card-head">
                    <h2>Analytics</h2>
                    <div class="seg" id="days" role="group" aria-label="Time range">
                        <button data-days="7">7 days</button>
                        <button data-days="30" class="on">30 days</button>
                        <button data-days="90">90 days</button>
                    </div>
                </div>
                <div class="grid">
                    <figure><figcaption>Incidents per day</figcaption><div id="chart-trend"></div></figure>
                    <figure><figcaption>Top source IPs</figcaption><div id="chart-ips"></div></figure>
                    <figure><figcaption>MITRE ATT&amp;CK techniques</figcaption><div id="chart-mitre"></div></figure>
                    <figure><figcaption>Score distribution</figcaption><div id="chart-scores"></div></figure>
                </div>
                <p class="note" id="analytics-note"></p>
            </section>

            <section class="card" id="history">
                <div class="card-head">
                    <h2>History</h2>
                </div>
                <form id="history-form" class="filters">
                    <label>Severity
                        <select id="h-severity">
                            <option value="">All</option>
                            <option>CRITICAL</option>
                            <option>HIGH</option>
                            <option>MEDIUM</option>
                            <option>LOW</option>
                        </select>
                    </label>
                    <label>From <input type="date" id="h-from"></label>
                    <label>To <input type="date" id="h-to"></label>
                    <label>Source IP <input type="text" id="h-ip" maxlength="64" placeholder="203.0.113."></label>
                    <label>User <input type="text" id="h-user" maxlength="64"></label>
                    <label>Technique <input type="text" id="h-technique" maxlength="64" placeholder="T1562.008"></label>
                    <button type="submit" class="btn btn-primary">Search</button>
                    <button type="button" id="h-reset" class="btn">Clear</button>
                </form>
                <div class="table-wrap">
                    <table id="history-table">
                        <thead>
                            <tr><th>Time</th><th>Severity</th><th>Score</th><th>Source IP</th><th>User</th><th>Techniques</th><th>Response</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="more"><button id="more" class="btn" hidden>Load more</button></div>
            </section>
        </div>
    </main>

    <aside id="drawer" class="drawer" hidden>
        <button id="drawer-close" class="btn">Close</button>
        <div id="drawer-body"></div>
    </aside>

    <div id="tip" class="tip" hidden></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
